  <div class="container">
    <h1>Task 5. Add & Remove Elements</h1>
    <ul id="myList">
      <li>Item 1</li>
      <li>Item 2</li>
    </ul>

    <button id="addEndBtn">Add Item (end)</button>
    <button id="addStartBtn">Add Item (start)</button>
    <button id="removeBtn">Remove Item</button>
  </div>

  <script>
    $(document).ready(function () {

      // the list already has 2 items
      var itemNumber = 2;

      // append() adds a new item at the end of the list
      $("#addEndBtn").click(function () {
        itemNumber = itemNumber + 1;
        $("#myList").append("<li>Item " + itemNumber + "</li>");
      });

      // prepend() adds a new item at the beginning of the list
      $("#addStartBtn").click(function () {
        itemNumber = itemNumber + 1;
        $("#myList").prepend("<li>Item " + itemNumber + "</li>");
      });

      // remove() deletes the last item of the list
      $("#removeBtn").click(function () {
        $("#myList li:last").remove();
      });

    });
  </script>
</body>
</html>
