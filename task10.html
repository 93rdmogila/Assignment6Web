  <div class="container">
    <h1>Task 10. Combined Animation</h1>
    <div class="stage">
      <div id="box" class="box"></div>
    </div>

    <button id="animateBtn">Animate</button>
    <button id="resetBtn">Reset</button>
  </div>

  <script>
    $(document).ready(function () {

      // opacity + size + movement in ONE animate() call
      $("#animateBtn").click(function () {
        $("#box").animate({
          opacity: 0.3,
          width: "200px",
          height: "200px",
          left: "300px",
          top: "50px"
        }, 1500);
      });

      // back to the start values
      $("#resetBtn").click(function () {
        $("#box").animate({
          opacity: 1,
          width: "100px",
          height: "100px",
          left: "0px",
          top: "0px"
        }, 1500);
      });

    });
  </script>
</body>
