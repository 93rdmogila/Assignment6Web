  <div class="container">
    <h1>Task 9. Sequential Animations</h1>
    <div class="stage">
      <div id="box" class="box"></div>
    </div>

    <button id="startBtn">Start</button>
  </div>

  <script>
    $(document).ready(function () {

      // Animations written one after another run one by one (in a queue)
      $("#startBtn").click(function () {
        // 1. move right
        $("#box").animate({ left: "250px" }, 800);
        // 2. move down
        $("#box").animate({ top: "150px" }, 800);
        // 3. shrink
        $("#box").animate({ width: "50px", height: "50px" }, 800);
        // 4. return to the original position and size
        $("#box").animate({ left: "0px", top: "0px", width: "100px", height: "100px" }, 800);
      });

    });
  </script>
</body>
