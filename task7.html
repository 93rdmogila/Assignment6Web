  <div class="container">
    <h1>Task 7. Form Interaction</h1>
    <form>
      <label for="name">Name:</label><br>
      <input type="text" id="name" placeholder="Enter your name"><br><br>

      <label for="email">Email:</label><br>
      <input type="text" id="email" placeholder="Enter your email">
    </form>

    <h3>You typed:</h3>
    <p>Name: <span id="nameOutput"></span></p>
    <p>Email: <span id="emailOutput"></span></p>
  </div>

  <script>
    $(document).ready(function () {

      // every time the user types in the Name field, show the text below
      $("#name").on("input", function () {
        var nameValue = $("#name").val();
        $("#nameOutput").text(nameValue);
      });

      // the same for the Email field
      $("#email").on("input", function () {
        var emailValue = $("#email").val();
        $("#emailOutput").text(emailValue);
      });

    });
  </script>
</body>
