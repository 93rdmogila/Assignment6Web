  <div class="container">
    <h1>Task 4. Slide Methods</h1>
    <div id="panel" class="panel">
      <p>This is a collapsible panel. It can slide up and down.</p>
    </div>

    <button id="slideUpBtn">Slide Up</button>
    <button id="slideDownBtn">Slide Down</button>
    <button id="slideToggleBtn">Slide Toggle</button>
  </div>

  <script>
    $(document).ready(function () {

      $("#slideUpBtn").click(function () {
        $("#panel").slideUp();
      });

      $("#slideDownBtn").click(function () {
        $("#panel").slideDown();
      });

      $("#slideToggleBtn").click(function () {
        $("#panel").slideToggle();
      });

    });
  </script>
