  <div class="container">
    <h1>Task 6. Modifying Attributes</h1>
    <img id="photo" src="images/image1.svg" alt="Picture" width="300">
    <br>
    <button id="changeImgBtn">Change image</button>

    <p>
      <a id="myLink" href="https://www.google.com" target="_blank">Go to Google</a>
    </p>
    <p>Current link: <span id="hrefInfo">https://www.google.com</span></p>
    <button id="changeLinkBtn">Change link</button>
  </div>

  <script>
    $(document).ready(function () {

      // attr("src", value) changes the src attribute of the image
      $("#changeImgBtn").click(function () {
        $("#photo").attr("src", "images/image2.svg");
      });

      // attr("href", value) changes the href attribute of the link
      $("#changeLinkBtn").click(function () {
        $("#myLink").attr("href", "https://www.wikipedia.org");
        $("#myLink").text("Go to Wikipedia");
        $("#hrefInfo").text("https://www.wikipedia.org");
      });

    });
  </script>
</body>
</html>
