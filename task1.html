<body>

    <a href="task11.html">Task 11</a>
  </div>

  <div class="container">
    <h1>Task 1. Selectors & CSS</h1>
    <h2 id="title">Original title (ID)</h2>
    <p class="info">Original text 1 (class)</p>
    <p class="info">Original text 2 (class)</p>
    <ul>
      <li>List item 1 (tag)</li>
      <li>List item 2 (tag)</li>
      <li>List item 3 (tag)</li>
    </ul>

    <button id="btnId">Select by ID: .text()</button>
    <button id="btnClass">Select by class: .html()</button>
    <button id="btnTag">Select by tag: .css()</button>
  </div>

  <script>
    $(document).ready(function () {

      // Select by ID (#) and change the text
      $("#btnId").click(function () {
        $("#title").text("Title changed with .text()");
      });

      // Select by class (.) and change the HTML (we can add tags here)
      $("#btnClass").click(function () {
        $(".info").html("<b>Text changed with .html()</b>");
      });

      // Select by tag name and change the style
      $("#btnTag").click(function () {
        $("li").css("color", "red");
        $("li").css("font-size", "20px");
      });

    });
  </script>
</body>
</html>
